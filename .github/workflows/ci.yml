name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eventovivo
          POSTGRES_PASSWORD: eventovivo_pass
          POSTGRES_DB: eventovivo_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://eventovivo:eventovivo_pass@localhost:5432/eventovivo
      DATABASE_URL_TEST: postgres://eventovivo:eventovivo_pass@localhost:5433/eventovivo_test
      SESSION_SECRET: ci_secret_for_testing_only_32chars_x

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Ejecutar pruebas
        run: npm test

      - name: Construir proyecto
        run: npm run build

      - name: Reporte de cobertura
        run: npm run test:coverage
