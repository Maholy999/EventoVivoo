services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eventovivo
      POSTGRES_PASSWORD: eventovivo_pass
      POSTGRES_DB: eventovivo
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U eventovivo" ]
      interval: 5s
      timeout: 5s
      retries: 10

  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eventovivo
      POSTGRES_PASSWORD: eventovivo_pass
      POSTGRES_DB: eventovivo_test
    ports:
      - "5436:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U eventovivo" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://eventovivo:eventovivo_pass@db:5432/eventovivo
      SESSION_SECRET: local-development-secret-minimum-32-chars
      SESSION_EXPIRES_DAYS: "7"
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run db:migrate && npm run dev"

volumes:
  pgdata:
